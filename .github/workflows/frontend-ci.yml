    #         continue-on-error: false
          
    #       - name: Run Unit using Vitest with coverage
    #         run: pnpm test:unit:coverage
    #         continue-on-error: false
    
    # E2E tests only run on main and dev branches 
    e2e-tests:
      runs-on: ubuntu-latest
      # needs: build
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/feature/')
      
      # Create PostgreSQL service container, needed for full E2E tests
      services:
        postgres:
            image: postgres:latest
            env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: test_db
            # Set health checks to wait until postgres has started
            options: >-
                --health-cmd pg_isready
                --health-interval 10s
                --health-timeout 5s
                --health-retries 5
            ports:
                - 5432:5432
      defaults:
        run:
          working-directory: frontend/
      
      steps:
        - name: Checkout the code
          uses: actions/checkout@v4
          with:
            sparse-checkout: |
                frontend
                backend
            sparse-checkout-cone-mode: true

        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
            version: 9

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            cache-dependency-path: frontend/pnpm-lock.yaml
            node-version: '21'
            cache: 'pnpm'
  
        - name: Install dependencies
          run: pnpm install --frozen-lockfile
                  
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3.7.1
          with:
            cache-binary: true
            cleanup: true

        - name: Build the Backend Container
          run: docker build --target dev -t backend:latest -f ../backend/Dockerfile ../backend
        
        - name: Run the Backend Container
          run: | 
            docker run --name backend -d  \
              --env ENVIRONMENT=${{ env.ENVIRONMENT }} \
              --env TEST_DATABASE_URL=postgresql+asyncpg://postgres-test-user:password@postgres:5432/qrafty_test_db \
              --env SECRET_KEY=${{ env.SECRET_KEY }} \
              --env ALLOWED_ORIGINS=${{ env.ALLOWED_ORIGINS }} \
              -p 8000:8000 backend:latest
        
        - name: Wait for backend to be ready
          run: |
              for i in {1..30}; do
                if curl -s http://localhost:8000/openapi.json; then
                  echo "Backend is ready!"
                  break
                fi
                echo "Waiting for backend to be ready..."
                sleep 2
              done
              
        - name: Run Alembic DB migrations
          run: |
              docker exec backend alembic upgrade head
