name: Frontend CI

on:
    push:
        branches:
            - main
            - dev
            - 'feature/*'
        paths:
            - '**.ts'
            - '**.vue'
            - '**.html'
            - '.github/workflows/frontend-ci.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
    pull_request:
        branches:
            - main
            - dev
            - 'feature/*'
        paths:
            - '**.ts'
            - '**.vue'
            - '**.html'
            - '.github/workflows/frontend-ci.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
permissions: 
    contents: read

env:
    CI: true
    ENVIRONMENT: testing
    ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    NUXT_PUBLIC_ENVIROMENT: ${{ secrets.NUXT_PUBLIC_ENVIRONMENT }}
    NUXT_PUBLIC_PLAYWRIGHT_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_PLAYWRIGHT_API_BASE_URL }}
    TEST_DATABASE_URL: ${{secrets.TEST_DATABASE_URL}}
    SECRET_KEY: ${{ secrets.SECRET_KEY }}

