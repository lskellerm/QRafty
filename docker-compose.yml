name: qrafty
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev # Use the 'dev" stage when targeting development environments builds
    volumes:
      - .:/workspace:cached
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE}
      - NUXT_PUBLIC_ENVIRONMENT=${NUXT_PUBLIC_ENVIRONMENT}
      - NUXT_PUBLIC_PLAYWRIGHT_API_BASE_URL=${NUXT_PUBLIC_PLAYWRIGHT_API_BASE_URL}
    profiles: [ development ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev # Use the 'dev" stage when targeting development environment builds
    volumes:
      - .:/workspace:cached
    ports:
      - "8000:8000"
    depends_on:
      dev-db:
        condition: service_started
    environment:
      - DEV_DATABASE_URL=${DEV_DATABASE_URL}
      - TEST_DATABASE_URL=${TEST_DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=testing
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    command: >
      bash -c "tail -f /dev/null "
    profiles: [ development ]

  db-migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/workspace:cached
    depends_on:
      test-db:
        condition: service_healthy

    environment:
      - TEST_DATABASE_URL=${TEST_DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=testing
    command: >
      bash -c "export ENVIRONMENT=testing && cd backend && alembic upgrade head && echo Database setup completed successfully and, the backend is now ready for testing"

    profiles: [ testing ]

  dev-db:
    image: postgres:latest
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_DEV_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DEV_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DEV_DB}
    ports:
      - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DEV_USER} -d ${POSTGRES_DEV_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: [ development ]

  test-db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_TEST_USER}
      - POSTGRES_PASSWORD=${POSTGRES_TEST_PASSWORD}
      - POSTGRES_DB=${POSTGRES_TEST_DB}
    ports:
      - "5433:5432"
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ testing ]

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - dev-db
    profiles: [ development ]

  playwright:
    container_name: playwright-server
    image: mcr.microsoft.com/playwright:v1.48.0-noble
    ports:
      - "9222:9222"
    command: [ "npx", "-y", "playwright@1.48.0", "run-server", "--port", "9222" ]
    profiles: [ testing ]

volumes:
  postgres_dev_data:


